version: "3.8"
services:
    postgres:
        image: postgres:latest
        restart: always
        container_name: postgres
        ports:
            - 5432:5432
        volumes:
            - ./postgres/db:/var/lib/postgresql/data
        environment:
            - PGDATA=/var/lib/postgresql/data
            - POSTGRES_USER=admin
            - POSTGRES_PASSWORD=admin
        # postgres连接的url: postgres://admin:admin@localhost:5432
