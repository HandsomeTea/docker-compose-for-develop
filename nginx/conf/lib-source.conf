server {
    listen 80;
    # server_name yourdomain.com; # 替换为你的域名

    # 字符集设置，防止中文目录乱码
    charset utf-8;

    # 强制将不带斜杠的 /lib 重定向带上斜杠
    location = /lib {
        return 301 $scheme://$host/lib/;
    }

    # 处理 /lib/ 路径的目录浏览和下载
    location /lib/ {
        # 指定本地要映射的绝对目录路径，末尾必须加上斜杠
       alias /var/www/lib-source/;

        # 开启目录自动索引（允许用户查看目录结构和文件列表）
        autoindex on;

        # 开启文件大小显示（on: bytes, off: human readable 如 KB/MB）
        autoindex_exact_size off;

        # 开启服务器本地时间显示
        autoindex_localtime on;

        # --- 基础认证配置（弹窗输入用户名密码） ---
        auth_basic "Restricted Access"; # 弹窗提示信息
        auth_basic_user_file /etc/nginx/.htpasswd; # 指向密码文件

        index off;
    }
}
